name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      params:
        type: string
        description: Build Params
        required: true
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.validate.outputs.runner }}
    steps:
      - name: Validate build machine
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            let params;
            try {
              params = JSON.parse(context.payload.inputs.params);
            } catch {
              core.setFailed("params must be valid JSON");
              return;
            }
            const allowed = ["ubuntu-22.04", "ubuntu-24.04"];
            // Compatibility fallback for AppCenter versions before buildMachine dispatch.
            const runner = params.buildMachine || "ubuntu-22.04";
            if (typeof runner !== "string" || !allowed.includes(runner)) {
              core.setFailed(`Unsupported buildMachine: ${runner}`);
              return;
            }
            core.setOutput("runner", runner);

  build:
    needs: preflight
    runs-on: ${{ needs.preflight.outputs.runner }}
    env:
      SENTRY_ALLOW_FAILURE: true
    steps:
      - name: Mask sensitive parameters
        env:
          PARAMS: ${{ github.event.inputs.params }}
        run: |
          node -e '
            try {
              const p = JSON.parse(process.env.PARAMS || "{}");
              for (const k of ["p12pass", "keystorePassword", "keyPassword", "password"]) {
                if (p[k]) console.log(`::add-mask::${p[k]}`);
              }
            } catch {}
          '

      - name: Clone Repo
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
          BRANCH: ${{ fromJSON(github.event.inputs.params).branch }}
          REPO: ${{ fromJSON(github.event.inputs.params).repo }}
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch="$BRANCH" "https://${GIT_USERNAME}:${GIT_PASSWORD}@${REPO}" input

      - name: Get Apps Version
        id: package-version
        working-directory: input
        run: |
          current_version=$(node -e "console.log(require('./package.json').version)")
          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"
          commit_hash=$(git rev-parse HEAD 2>/dev/null || echo "")
          echo "commit-hash=$commit_hash" >> "$GITHUB_OUTPUT"

      - name: Logging
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
          RUN_ID: ${{ github.run_id }}
          PARAMS: ${{ github.event.inputs.params }}
          UNIQUE_ID: ${{ fromJSON(github.event.inputs.params).uniqueId }}
          PROJECT_ID: ${{ fromJSON(github.event.inputs.params).projectid }}
          VERSION: ${{ steps.package-version.outputs.current-version }}
          COMMIT_HASH: ${{ steps.package-version.outputs.commit-hash }}
        run: |
          curl -s -L -X POST \
            -H "X-AppCenter-Secret: $APPCENTER_SECRET" \
            --data-urlencode "wf_id=$RUN_ID" \
            --data-urlencode "params=$PARAMS" \
            --data-urlencode "uniqueId=$UNIQUE_ID" \
            --data-urlencode "version=$VERSION" \
            --data-urlencode "commit_hash=$COMMIT_HASH" \
            --data-urlencode "platform=android" \
            "https://$APPCENTER_DOMAIN/projects/$PROJECT_ID/trigger-log"
      - name: Setup Java JDK
        uses: actions/setup-java@v4.4.0
        if: ${{ fromJSON(github.event.inputs.params).java != '' }}
        with:
          java-version: ${{ fromJSON(github.event.inputs.params).java }}
          distribution: corretto
      # - name: Cache Gradle
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.gradle/caches
      #       ~/.gradle/wrapper
      #       input/android/.gradle
      #     key: ${{ runner.os }}-gradle-${{ fromJSON(github.event.inputs.params).projectid }}-${{ fromJSON(github.event.inputs.params).branch }}-${{ hashFiles('input/android/**/*.gradle*', 'input/android/gradle-wrapper.properties') }}
      #     restore-keys: |
      #       ${{ runner.os }}-gradle-${{ fromJSON(github.event.inputs.params).projectid }}-${{ fromJSON(github.event.inputs.params).branch }}-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Setup Android NDK
        if: ${{ fromJSON(github.event.inputs.params).ndk != '' }}
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: ${{ fromJSON(github.event.inputs.params).ndk }}
          add-to-path: true
          link-to-sdk: true
          local-cache: true
      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.4
        if: ${{ fromJSON(github.event.inputs.params).node != '' }}
        with:
          node-version: ${{ fromJSON(github.event.inputs.params).node }}
      # - name: Cache Node Modules
      #   uses: actions/cache@v4
      #   with:
      #     path: input/node_modules
      #     key: ${{ runner.os }}-node-modules-${{ fromJSON(github.event.inputs.params).projectid }}-${{ fromJSON(github.event.inputs.params).branch }}-${{ hashFiles('input/yarn.lock', 'input/package-lock.json', 'input/pnpm-lock.yaml') }}
      #     restore-keys: |
      #       ${{ runner.os }}-node-modules-${{ fromJSON(github.event.inputs.params).projectid }}-${{ fromJSON(github.event.inputs.params).branch }}-
      - name: Increase File Watcher Limit
        run: |
          echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf
          echo fs.inotify.max_user_instances=1024 | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p
      - name: Yarn Install
        working-directory: input
        run: |
          corepack enable
          yarn install
      - name: Gradle Build
        working-directory: input/android
        run: ./gradlew assemble${{ fromJSON(github.event.inputs.params).flavor }}${{ fromJSON(github.event.inputs.params).configuration }} ${{ fromJSON(github.event.inputs.params).gradlecmd }}
      - name: Name Android artifacts uniquely
        env:
          SUFFIX: ${{ fromJSON(github.event.inputs.params).artifactSuffix }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            directory=$(dirname "$file")
            filename=$(basename "$file")
            extension="${filename##*.}"
            stem="${filename%.*}"
            mv "$file" "$directory/${stem}-${SUFFIX}.${extension}"
          done < <(find input -type f \( -name '*.apk' -o -name '*.aab' \) -print0)
      - name: Upload to release
        id: release
        uses: muhamad-rizki/action-gh-release@v3.0.5
        with:
          repository: ${{ fromJSON(github.event.inputs.params).releaseTo }}
          token: ${{ secrets.GH_PAT }}
          files: |
            input/**/outputs/**/*.apk
            input/**/outputs/**/*.aab
          tag_name: "v${{ steps.package-version.outputs.current-version}}-${{ fromJSON(github.event.inputs.params).configuration }}-${{ fromJSON(github.event.inputs.params).branch }}"
          body: "APK Release v${{ steps.package-version.outputs.current-version}} (${{ fromJSON(github.event.inputs.params).configuration }})"
          body_path: ./input/${{ fromJSON(github.event.inputs.params).releasenote != '' && fromJSON(github.event.inputs.params).releasenote || 'releasenote.md' }}
      - name: Update DB
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
          PROJECT_ID: ${{ fromJSON(github.event.inputs.params).projectid }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          COMMIT_HASH: ${{ steps.package-version.outputs.commit-hash }}
        run: |
          curl -s -L -X POST \
            -H "X-AppCenter-Secret: $APPCENTER_SECRET" \
            "https://$APPCENTER_DOMAIN/projects/$PROJECT_ID/release?id=$RELEASE_ID&commit_hash=$COMMIT_HASH"
      - name: Upload Source Maps
        id: release-maps
        uses: muhamad-rizki/action-gh-release@v3.0.5
        with:
          repository: ${{ fromJSON(github.event.inputs.params).releaseTo }}
          token: ${{ secrets.GH_PAT }}
          files: |
            ./input/android/**/mapping.txt
            ./input/android/**/*.bundle.map
            ./input/android/**/*.jsbundle.map
            ./**/*.dSYM.zip
          tag_name: "v${{ steps.package-version.outputs.current-version}}-${{ fromJSON(github.event.inputs.params).configuration }}-${{ fromJSON(github.event.inputs.params).branch }}"
