name: Resign IPA
on:
  workflow_dispatch:
    inputs:
      url:
        type: string
        description: IPA URL
        required: true
      branch:
        type: choice
        description: Branch to use
        required: true
        options: 
          - master-dev
          - master-uat
      projectid:
        type: string
        description: Project ID
        required: true
      releaseTo:
        type: string
        description: Release To
        required: true
      configuration:
        type: choice
        description: Release configuration
        required: true
        options:
          - Release
          - Debug
      version:
        type: string
        required: true
        description: Apps Version
jobs:
  build:
    runs-on: macOS-latest
    steps:
      - name: Checkout CI Scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Logging
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
        run: node scripts/trigger-log.js --platform ios --project-id "${{ github.event.inputs.projectid }}" --version "${{ github.event.inputs.version }}"

      - name: Clone Provision
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/clone-provision.js

      - name: Download IPA
        run: curl --fail-with-body --silent --show-error -L --output output.ipa "${{ github.event.inputs.url }}"
      - name: Build IPA
        uses: muhamad-rizki/ios-build-action@v1.0.11
        with:
          p12-path: ./provision/${{ github.event.inputs.projectid }}/${{ github.event.inputs.branch }}.p12
          mobileprovision-path: ./provision/${{ github.event.inputs.projectid }}/${{ github.event.inputs.branch }}.mobileprovision
          code-signing-identity: 'iPhone Distribution'
          resign: true
          ipa-path: ./output.ipa
      - name: Upload to release
        uses: muhamad-rizki/action-gh-release@v3.0.5
        with:
          repository: ${{ github.event.inputs.releaseTo }}
          token: ${{ secrets.GH_PAT }}
          files: |
            output.ipa
          tag_name: "v${{ github.event.inputs.version }}-${{ github.event.inputs.configuration }}-${{ github.event.inputs.branch }}"
