name: Repack and Release iOS
on:
  workflow_dispatch:
    inputs:
      projectid:
        type: string
        description: Project ID
        required: true
      branch:
        type: string
        description: Branch
        required: false
jobs:
  repack:
    name: Repack IPA
    runs-on: macos-14
    steps:
      - name: Checkout Workflow Scripts
        uses: actions/checkout@v4

      - name: Fetch Build Configuration
        id: fetch-config
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
        run: node scripts/fetch-config.js --platform ios --project-id "${{ github.event.inputs.projectid }}" --branch "${{ github.event.inputs.branch }}"

      - name: Clone Source Repo
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
        run: node scripts/clone-repo.js

      - name: Clone Provision Repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node scripts/clone-provision.js

      - name: Get App Version
        id: package-version
        working-directory: input
        run: |
          current_version=$(node -e "console.log(require('./package.json').version)")
          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Logging
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
        run: node scripts/trigger-log.js --platform ios --version "${{ steps.package-version.outputs.current-version }}"

      - name: Setup Node.js
        if: ${{ fromJSON(steps.fetch-config.outputs.params).node != '' && fromJSON(steps.fetch-config.outputs.params).node != null }}
        uses: actions/setup-node@v4.0.4
        with:
          node-version: ${{ fromJSON(steps.fetch-config.outputs.params).node }}

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: input/node_modules
          key: ${{ runner.os }}-node-modules-${{ github.event.inputs.projectid }}-${{ hashFiles('input/yarn.lock', 'input/package-lock.json', 'input/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ github.event.inputs.projectid }}-

      - name: Install Dependencies
        working-directory: input
        run: |
          corepack enable
          if [ -f "yarn.lock" ]; then
            yarn install
          elif [ -f "pnpm-lock.yaml" ]; then
            pnpm install
          else
            npm install
          fi

      - name: Repack and Sign IPA
        env:
          CI: "true"
          WORK_DIR: ${{ github.workspace }}
          SOURCE_DIR: ${{ github.workspace }}/input
          PROVISION_DIR: ${{ github.workspace }}/provision
          BUNDLE_OUTPUT_DIR: ${{ github.workspace }}/bundle_output
          RELEASE_DOWNLOAD_DIR: ${{ github.workspace }}/release_download
          RELEASE_REPO: ${{ fromJSON(steps.fetch-config.outputs.params).releaseRepo }}
          RELEASE_TAG: ${{ fromJSON(steps.fetch-config.outputs.params).releaseTag }}
          IPA_FILENAME: ${{ fromJSON(steps.fetch-config.outputs.params).ipaFilename || '*.ipa' }}
          PROJECT_ID: ${{ github.event.inputs.projectid }}
          PROVISION_FILE: ${{ steps.fetch-config.outputs.provision_file }}
          P12_PASSWORD: ${{ steps.fetch-config.outputs.p12_password }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          APP_VERSION: ${{ steps.package-version.outputs.current-version }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ fromJSON(steps.fetch-config.outputs.params).sentryProject || '' }}
          SENTRY_RELEASE: ${{ fromJSON(steps.fetch-config.outputs.params).sentryRelease || steps.package-version.outputs.current-version }}
          SENTRY_DIST: ${{ fromJSON(steps.fetch-config.outputs.params).sentryDist || fromJSON(steps.fetch-config.outputs.params).configuration || '' }}
        run: bash scripts/repack_ios.sh

      - name: Upload to Release
        id: release
        uses: muhamad-rizki/action-gh-release@v3.0.5
        with:
          repository: ${{ fromJSON(steps.fetch-config.outputs.params).releaseTo }}
          token: ${{ secrets.GH_PAT }}
          files: |
            release_download/resigned-output.ipa
            release_download/manifest.plist
          tag_name: "v${{ steps.package-version.outputs.current-version }}-${{ fromJSON(steps.fetch-config.outputs.params).configuration }}-${{ fromJSON(steps.fetch-config.outputs.params).branch }}"
          body: "Repacked IPA v${{ steps.package-version.outputs.current-version }} (${{ fromJSON(steps.fetch-config.outputs.params).configuration }})"
          body_path: ./input/${{ fromJSON(steps.fetch-config.outputs.params).releasenote || 'releasenote.md' }}

      - name: Update DB
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
        run: node scripts/update-release.js --release-id "${{ steps.release.outputs.id }}"
