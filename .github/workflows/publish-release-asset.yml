name: Publish Release Asset
run-name: publish-release-asset-${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: AppCenter artifact job ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-asset-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout CI Scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Publish Release Asset
        env:
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: node scripts/publish-asset.js --job-id "$JOB_ID"

      - name: Report publication failure or cancellation
        if: failure() || cancelled()
        env:
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/publish-asset.js --report-failure --job-id "$JOB_ID" --status "$JOB_STATUS"
