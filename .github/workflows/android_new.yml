name: Build Android APK (NEW)
on:
  workflow_dispatch:
    inputs:
      projectid:
        type: string
        description: Project ID
        required: true
      branch:
        type: string
        description: Branch
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SENTRY_ALLOW_FAILURE: true
    steps:
      - name: Checkout CI Scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Fetch Build Configuration
        id: fetch-config
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
        run: node scripts/fetch-config.js --platform android --project-id "${{ github.event.inputs.projectid }}" --branch "${{ github.event.inputs.branch }}"

      - name: Clone Repo
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
        run: node scripts/clone-repo.js

      - name: Get Apps Version
        id: package-version
        working-directory: input
        run: |
          current_version=$(node -e "console.log(require('./package.json').version)")
          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"
          commit_hash=$(git rev-parse HEAD 2>/dev/null || echo "")
          echo "commit-hash=$commit_hash" >> "$GITHUB_OUTPUT"

      - name: Logging
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
        run: node scripts/trigger-log.js --platform android --version "${{ steps.package-version.outputs.current-version }}" --commit "${{ steps.package-version.outputs.commit-hash }}"

      - name: Setup Java JDK
        uses: actions/setup-java@v4.4.0
        if: ${{ fromJSON(steps.fetch-config.outputs.params).java != '' && fromJSON(steps.fetch-config.outputs.params).java != null }}
        with:
          java-version: ${{ fromJSON(steps.fetch-config.outputs.params).java }}
          distribution: corretto

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            input/android/.gradle
          key: ${{ runner.os }}-gradle-${{ github.event.inputs.projectid }}-${{ hashFiles('input/android/**/*.gradle*', 'input/android/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ github.event.inputs.projectid }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup Android NDK
        if: ${{ fromJSON(steps.fetch-config.outputs.params).ndk != '' && fromJSON(steps.fetch-config.outputs.params).ndk != null }}
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: ${{ fromJSON(steps.fetch-config.outputs.params).ndk }}
          add-to-path: true
          link-to-sdk: true
          local-cache: true

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.4
        if: ${{ fromJSON(steps.fetch-config.outputs.params).node != '' && fromJSON(steps.fetch-config.outputs.params).node != null }}
        with:
          node-version: ${{ fromJSON(steps.fetch-config.outputs.params).node }}

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: input/node_modules
          key: ${{ runner.os }}-node-modules-${{ github.event.inputs.projectid }}-${{ hashFiles('input/yarn.lock', 'input/package-lock.json', 'input/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ github.event.inputs.projectid }}-

      - name: Increase File Watcher Limit
        run: |
          echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf
          echo fs.inotify.max_user_instances=1024 | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Yarn Install
        working-directory: input
        run: |
          corepack enable
          yarn install

      - name: Gradle Build
        working-directory: input/android
        run: ./gradlew assemble${{ fromJSON(steps.fetch-config.outputs.params).flavor }}${{ fromJSON(steps.fetch-config.outputs.params).configuration }} ${{ fromJSON(steps.fetch-config.outputs.params).gradlecmd }}

      - name: Upload to release
        id: release
        uses: muhamad-rizki/action-gh-release@v3.0.5
        with:
          repository: ${{ fromJSON(steps.fetch-config.outputs.params).releaseTo }}
          token: ${{ secrets.GH_PAT }}
          files: |
            input/**/outputs/**/*.apk
            input/**/outputs/**/*.aab
          tag_name: "v${{ steps.package-version.outputs.current-version}}-${{ fromJSON(steps.fetch-config.outputs.params).configuration }}-${{ fromJSON(steps.fetch-config.outputs.params).branch }}"
          body: "APK Release v${{ steps.package-version.outputs.current-version}} (${{ fromJSON(steps.fetch-config.outputs.params).configuration }})"
          body_path: ./input/${{ fromJSON(steps.fetch-config.outputs.params).releasenote || 'releasenote.md' }}

      - name: Update DB
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
        run: node scripts/update-release.js --release-id "${{ steps.release.outputs.id }}" --commit "${{ steps.package-version.outputs.commit-hash }}"

      - name: Upload Source Maps
        id: release-maps
        uses: muhamad-rizki/action-gh-release@v3.0.5
        with:
          repository: ${{ fromJSON(steps.fetch-config.outputs.params).releaseTo }}
          token: ${{ secrets.GH_PAT }}
          files: |
            ./input/android/**/mapping.txt
            ./input/android/**/*.bundle.map
            ./input/android/**/*.jsbundle.map
            ./**/*.dSYM.zip
          tag_name: "v${{ steps.package-version.outputs.current-version}}-${{ fromJSON(steps.fetch-config.outputs.params).configuration }}-${{ fromJSON(steps.fetch-config.outputs.params).branch }}"
