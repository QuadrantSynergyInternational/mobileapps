name: Resign IPA
on:
  workflow_dispatch:
    inputs:
      url:
        type: string
        description: IPA URL
        required: true
      branch:
        type: choice
        description: Branch to use
        required: true
        options: 
          - master-dev
          - master-uat
      projectid:
        type: string
        description: Project ID
        required: true
      releaseTo:
        type: string
        description: Release To
        required: true
      configuration:
        type: choice
        description: Release configuration
        required: true
        options:
          - Release
          - Debug
      version:
        type: string
        required: true
        description: Apps Version
jobs:
  build:
    runs-on: macOS-latest
    steps:
      - name: Logging
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
          PROJECT_ID: ${{ github.event.inputs.projectid }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -s -L -X POST \
            -H "X-AppCenter-Secret: $APPCENTER_SECRET" \
            "https://$APPCENTER_DOMAIN/projects/$PROJECT_ID/trigger-log?wf_id=$RUN_ID"
      - name: Clone Provision
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch=main "https://admindevopsqsi:${GH_PAT}@github.com/admindevopsqsi/ios-provision.git" provision
      - name: Download IPA
        run: curl --fail-with-body -L --output output.ipa ${{ github.event.inputs.url }}
      - name: Build IPA
        uses: muhamad-rizki/ios-build-action@v1.0.11
        with:
          p12-path: ./provision/${{ github.event.inputs.projectid }}/${{ github.event.inputs.branch }}.p12
          mobileprovision-path: ./provision/${{ github.event.inputs.projectid }}/${{ github.event.inputs.branch }}.mobileprovision
          code-signing-identity: 'iPhone Distribution'
          resign: true
          ipa-path: ./output.ipa
      - name: Upload to release
        uses: muhamad-rizki/action-gh-release@v3.0.5
        with:
          repository: ${{ github.event.inputs.releaseTo }}
          token: ${{ secrets.GH_PAT }}
          files: |
            output.ipa
          tag_name: "v${{ github.event.inputs.version }}-${{ github.event.inputs.configuration }}-${{ github.event.inputs.branch }}"
