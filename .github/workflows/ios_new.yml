name: Build iOS IPA (NEW)
on:
  workflow_dispatch:
    inputs:
      projectid:
        type: string
        description: Project ID
        required: true
      branch:
        type: string
        description: Branch
        required: false
jobs:
  build:
    runs-on: macos-14
    env:
      SENTRY_ALLOW_FAILURE: true
    steps:
      - name: Fetch Build Configuration
        id: fetch-config
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
          PROJECT_ID: ${{ github.event.inputs.projectid }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          PARAMS=$(curl -s -f -L -G \
            -H "X-AppCenter-Secret: $APPCENTER_SECRET" \
            "https://$APPCENTER_DOMAIN/projects/$PROJECT_ID/buildparams?platform=ios&branch=$BRANCH")
          echo "params=$PARAMS" >> "$GITHUB_OUTPUT"

          PROVISION_FILE=$(echo "$PARAMS" | jq -r 'if .provisionfile and .provisionfile != "" then .provisionfile else .branch end')
          echo "provision_file=$PROVISION_FILE" >> "$GITHUB_OUTPUT"

          PROVISION_RES=$(curl -s -f -L -G \
            -H "X-AppCenter-Secret: $APPCENTER_SECRET" \
            "https://$APPCENTER_DOMAIN/projects/$PROJECT_ID/provision?name=${PROVISION_FILE}.p12&details=true")
          echo "provision=$PROVISION_RES" >> "$GITHUB_OUTPUT"

          PARAMS="$PARAMS" PROVISION_RES="$PROVISION_RES" node -e '
            try {
              const p = JSON.parse(process.env.PARAMS || "{}");
              for (const k of ["p12pass", "keystorePassword", "keyPassword", "password"]) {
                if (p[k]) console.log(`::add-mask::${p[k]}`);
              }
            } catch {}
            try {
              const pr = JSON.parse(process.env.PROVISION_RES || "{}");
              if (pr.password) console.log(`::add-mask::${pr.password}`);
            } catch {}
          '

      - name: Clone Repo
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
          BRANCH: ${{ fromJSON(steps.fetch-config.outputs.params).branch }}
          REPO: ${{ fromJSON(steps.fetch-config.outputs.params).repo }}
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch="$BRANCH" "https://${GIT_USERNAME}:${GIT_PASSWORD}@${REPO}" input

      - name: Clone Provision
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch=main "https://admindevopsqsi:${GH_PAT}@github.com/admindevopsqsi/ios-provision.git" provision

      - name: Get Apps Version
        id: package-version
        working-directory: input
        run: |
          current_version=$(node -e "console.log(require('./package.json').version)")
          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"
          commit_hash=$(git rev-parse HEAD 2>/dev/null || echo "")
          echo "commit-hash=$commit_hash" >> "$GITHUB_OUTPUT"

      - name: Logging
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
          RUN_ID: ${{ github.run_id }}
          PARAMS: ${{ steps.fetch-config.outputs.params }}
          UNIQUE_ID: ${{ fromJSON(steps.fetch-config.outputs.params).uniqueId }}
          PROJECT_ID: ${{ github.event.inputs.projectid }}
          VERSION: ${{ steps.package-version.outputs.current-version }}
          COMMIT_HASH: ${{ steps.package-version.outputs.commit-hash }}
        run: |
          curl -s -f -L -X POST \
            -H "X-AppCenter-Secret: $APPCENTER_SECRET" \
            --data-urlencode "wf_id=$RUN_ID" \
            --data-urlencode "params=$PARAMS" \
            --data-urlencode "uniqueId=$UNIQUE_ID" \
            --data-urlencode "version=$VERSION" \
            --data-urlencode "commit_hash=$COMMIT_HASH" \
            --data-urlencode "platform=ios" \
            "https://$APPCENTER_DOMAIN/projects/$PROJECT_ID/trigger-log"

      - name: Validate P12
        env:
          PROJECT_ID: ${{ github.event.inputs.projectid }}
          PROVISION_FILE: ${{ steps.fetch-config.outputs.provision_file }}
          P12_PASS: ${{ fromJSON(steps.fetch-config.outputs.provision).password || '' }}
        run: |
          set -euo pipefail
          P12_FILE="./provision/${PROJECT_ID}/${PROVISION_FILE}.p12"
          echo "🔧 Creating temporary keychain..."
          security create-keychain -p "" temp.keychain

          echo "🔓 Unlocking keychain..."
          security unlock-keychain -p "" temp.keychain

          echo "🔍 Validating P12 import..."
          if security import "$P12_FILE" -k temp.keychain -P "$P12_PASS" \
               -T /usr/bin/codesign \
               -T /usr/bin/security \
               -T /usr/bin/productbuild \
               -T /usr/bin/productsign; then
            echo "✅ Import successful"
          else
            echo "❌ Import failed" >&2
            security delete-keychain temp.keychain
            exit 1
          fi

          echo "🧹 Cleaning up keychain..."
          security delete-keychain temp.keychain

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        if: ${{ fromJSON(steps.fetch-config.outputs.params).ruby != '' && fromJSON(steps.fetch-config.outputs.params).ruby != null }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ./input

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.4
        if: ${{ fromJSON(steps.fetch-config.outputs.params).node != '' && fromJSON(steps.fetch-config.outputs.params).node != null }}
        with:
          node-version: ${{ fromJSON(steps.fetch-config.outputs.params).node }}

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: input/node_modules
          key: ${{ runner.os }}-node-modules-${{ github.event.inputs.projectid }}-${{ hashFiles('input/yarn.lock', 'input/package-lock.json', 'input/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ github.event.inputs.projectid }}-

      - name: Yarn Install
        working-directory: input
        run: |
          corepack enable
          yarn install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            input/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ github.event.inputs.projectid }}-${{ hashFiles('input/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-${{ github.event.inputs.projectid }}-

      - name: Pod Repo
        run: pod repo add QuadrantSpecs https://oktapod.quadrant-si.id/framework/quadrant.specs.git || pod repo update QuadrantSpecs

      - name: Detect New Architecture
        id: detect-arch
        working-directory: input
        run: |
          NEW_ARCH=$(grep -E "^newArchEnabled=true" android/gradle.properties || true)
          if [ -n "$NEW_ARCH" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "React Native New Architecture ENABLED"
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "React Native New Architecture DISABLED"
          fi

      - name: Pod install
        working-directory: input/ios
        run: |
          if [ "${{ steps.detect-arch.outputs.enabled }}" = "true" ]; then
            echo "⚙️ Enabling iOS New Architecture"
            export RCT_NEW_ARCH_ENABLED=1
          else
            echo "⚙️ Using Legacy Architecture"
          fi
          pod install --repo-update

      - name: Download Export Plist
        run: curl -s -f -L --output export.plist "https://appcenterq.vercel.app/ios-export?projectid=${{ github.event.inputs.projectid }}&branch=${{ fromJSON(steps.fetch-config.outputs.params).branch }}"

      - name: Build IPA
        uses: muhamad-rizki/ios-build-action@v1
        with:
          p12-path: ./provision/${{ github.event.inputs.projectid }}/${{ steps.fetch-config.outputs.provision_file }}.p12
          mobileprovision-path: ./provision/${{ github.event.inputs.projectid }}/${{ steps.fetch-config.outputs.provision_file }}.mobileprovision
          code-signing-identity: "iPhone Distribution"
          team-id: ${{ fromJSON(steps.fetch-config.outputs.params).teamid }}
          certificate-password: ${{ fromJSON(steps.fetch-config.outputs.provision).password || '' }}
          project-path: input/${{ fromJSON(steps.fetch-config.outputs.params).projectpath }}
          workspace-path: input/${{ fromJSON(steps.fetch-config.outputs.params).projectworkspace }}
          scheme: ${{ fromJSON(steps.fetch-config.outputs.params).scheme }}
          configuration: ${{ fromJSON(steps.fetch-config.outputs.params).configuration }}
          export-method: ${{ fromJSON(steps.fetch-config.outputs.params).exportmethod }}
          output-path: output-${{ fromJSON(steps.fetch-config.outputs.params).configuration }}.ipa
          xcode-path: ${{ fromJSON(steps.fetch-config.outputs.params).xcodepath || '' }}
          export-options: |
            ./export.plist
            ./provision/${{ github.event.inputs.projectid }}/${{ steps.fetch-config.outputs.provision_file }}.plist

      - name: Upload to release
        id: release
        uses: muhamad-rizki/action-gh-release@v3.0.5
        with:
          repository: ${{ fromJSON(steps.fetch-config.outputs.params).releaseTo }}
          token: ${{ secrets.GH_PAT }}
          files: |
            output-${{ fromJSON(steps.fetch-config.outputs.params).configuration }}.ipa
            manifest.plist
            AppStoreInfo.plist
          tag_name: "v${{ steps.package-version.outputs.current-version}}-${{ fromJSON(steps.fetch-config.outputs.params).configuration }}-${{ fromJSON(steps.fetch-config.outputs.params).branch }}"
          body: "IPA Release v${{ steps.package-version.outputs.current-version}} (${{ fromJSON(steps.fetch-config.outputs.params).configuration }})"
          body_path: ./input/${{ fromJSON(steps.fetch-config.outputs.params).releasenote || 'releasenote.md' }}

      - name: Update DB
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
          PROJECT_ID: ${{ github.event.inputs.projectid }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          COMMIT_HASH: ${{ steps.package-version.outputs.commit-hash }}
        run: |
          curl -s -f -L -X POST \
            -H "X-AppCenter-Secret: $APPCENTER_SECRET" \
            "https://$APPCENTER_DOMAIN/projects/$PROJECT_ID/release?id=$RELEASE_ID&commit_hash=$COMMIT_HASH"

      - name: Upload Source Maps
        id: release-maps
        uses: muhamad-rizki/action-gh-release@v3.0.5
        with:
          repository: ${{ fromJSON(steps.fetch-config.outputs.params).releaseTo }}
          token: ${{ secrets.GH_PAT }}
          files: |
            ./input/android/**/mapping.txt
            ./input/android/**/*.bundle.map
            ./input/android/**/*.jsbundle.map
            ./**/*.dSYM.zip
          tag_name: "v${{ steps.package-version.outputs.current-version}}-${{ fromJSON(steps.fetch-config.outputs.params).configuration }}-${{ fromJSON(steps.fetch-config.outputs.params).branch }}"
