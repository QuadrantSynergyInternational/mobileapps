name: Repack and Release Android
on:
  workflow_dispatch:
    inputs:
      projectid:
        type: string
        description: Project ID
        required: true
      branch:
        type: string
        description: Branch
        required: false
jobs:
  repack:
    name: Repack APK
    runs-on: macos-latest
    steps:
      - name: Checkout Workflow Scripts
        uses: actions/checkout@v4

      - name: Fetch Build Configuration
        id: fetch-config
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
          PROJECT_ID: ${{ github.event.inputs.projectid }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          PARAMS=$(curl -s -f -L -G \
            -H "X-AppCenter-Secret: $APPCENTER_SECRET" \
            "https://$APPCENTER_DOMAIN/projects/$PROJECT_ID/buildparams?platform=android&branch=$BRANCH")
          echo "params=$PARAMS" >> "$GITHUB_OUTPUT"
          PARAMS="$PARAMS" node -e '
            try {
              const p = JSON.parse(process.env.PARAMS || "{}");
              for (const k of ["p12pass", "keystorePassword", "keyPassword", "password"]) {
                if (p[k]) console.log(`::add-mask::${p[k]}`);
              }
            } catch {}
          '

      - name: Clone Source Repo
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
          BRANCH: ${{ fromJSON(steps.fetch-config.outputs.params).branch }}
          REPO: ${{ fromJSON(steps.fetch-config.outputs.params).repo }}
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch \
            --branch="$BRANCH" \
            "https://${GIT_USERNAME}:${GIT_PASSWORD}@${REPO}" \
            input

      - name: Get App Version
        id: package-version
        working-directory: input
        run: |
          current_version=$(node -e "console.log(require('./package.json').version)")
          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Logging
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
          RUN_ID: ${{ github.run_id }}
          PARAMS: ${{ steps.fetch-config.outputs.params }}
          UNIQUE_ID: ${{ fromJSON(steps.fetch-config.outputs.params).uniqueId }}
          PROJECT_ID: ${{ github.event.inputs.projectid }}
          VERSION: ${{ steps.package-version.outputs.current-version }}
        run: |
          curl -s -f -L -X POST \
            -H "X-AppCenter-Secret: $APPCENTER_SECRET" \
            --data-urlencode "wf_id=$RUN_ID" \
            --data-urlencode "params=$PARAMS" \
            --data-urlencode "uniqueId=$UNIQUE_ID" \
            --data-urlencode "version=$VERSION" \
            --data-urlencode "platform=android" \
            "https://$APPCENTER_DOMAIN/projects/$PROJECT_ID/trigger-log"

      - name: Setup Java JDK
        uses: actions/setup-java@v4.4.0
        if: ${{ fromJSON(steps.fetch-config.outputs.params).java != '' && fromJSON(steps.fetch-config.outputs.params).java != null }}
        with:
          java-version: ${{ fromJSON(steps.fetch-config.outputs.params).java }}
          distribution: corretto

      - name: Setup Node.js
        if: ${{ fromJSON(steps.fetch-config.outputs.params).node != '' && fromJSON(steps.fetch-config.outputs.params).node != null }}
        uses: actions/setup-node@v4.0.4
        with:
          node-version: ${{ fromJSON(steps.fetch-config.outputs.params).node }}

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: input/node_modules
          key: ${{ runner.os }}-node-modules-${{ github.event.inputs.projectid }}-${{ hashFiles('input/yarn.lock', 'input/package-lock.json', 'input/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-${{ github.event.inputs.projectid }}-

      - name: Install Dependencies
        working-directory: input
        run: |
          corepack enable
          if [ -f "yarn.lock" ]; then
            yarn install
          elif [ -f "pnpm-lock.yaml" ]; then
            pnpm install
          else
            npm install
          fi

      - name: Repack and Sign APK
        env:
          CI: "true"
          WORK_DIR: ${{ github.workspace }}
          SOURCE_DIR: ${{ github.workspace }}/input
          BUNDLE_OUTPUT_DIR: ${{ github.workspace }}/bundle_output
          RELEASE_DOWNLOAD_DIR: ${{ github.workspace }}/release_download
          RELEASE_REPO: ${{ fromJSON(steps.fetch-config.outputs.params).releaseRepo }}
          RELEASE_TAG: ${{ fromJSON(steps.fetch-config.outputs.params).releaseTag }}
          APK_FILENAME: ${{ fromJSON(steps.fetch-config.outputs.params).apkFilename || '*.apk' }}
          KEYSTORE_PATH: ${{ fromJSON(steps.fetch-config.outputs.params).keystorePath }}
          KEYSTORE_PASSWORD: ${{ fromJSON(steps.fetch-config.outputs.params).keystorePassword }}
          KEY_ALIAS: ${{ fromJSON(steps.fetch-config.outputs.params).keyAlias }}
          KEY_PASSWORD: ${{ fromJSON(steps.fetch-config.outputs.params).keyPassword }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          APP_VERSION: ${{ steps.package-version.outputs.current-version }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ fromJSON(steps.fetch-config.outputs.params).sentryProject || '' }}
          SENTRY_RELEASE: ${{ fromJSON(steps.fetch-config.outputs.params).sentryRelease || steps.package-version.outputs.current-version }}
          SENTRY_DIST: ${{ fromJSON(steps.fetch-config.outputs.params).sentryDist || fromJSON(steps.fetch-config.outputs.params).configuration || '' }}
        run: bash scripts/repack_android.sh

      - name: Upload to Release
        id: release
        uses: muhamad-rizki/action-gh-release@v3.0.5
        with:
          repository: ${{ fromJSON(steps.fetch-config.outputs.params).releaseTo }}
          token: ${{ secrets.GH_PAT }}
          files: release_download/resigned-output.apk
          tag_name: "v${{ steps.package-version.outputs.current-version }}-${{ fromJSON(steps.fetch-config.outputs.params).configuration }}-${{ fromJSON(steps.fetch-config.outputs.params).branch }}"
          body: "Repacked APK v${{ steps.package-version.outputs.current-version }} (${{ fromJSON(steps.fetch-config.outputs.params).configuration }})"
          body_path: ./input/${{ fromJSON(steps.fetch-config.outputs.params).releasenote || 'releasenote.md' }}

      - name: Update DB
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
          PROJECT_ID: ${{ github.event.inputs.projectid }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          curl -s -f -L -X POST \
            -H "X-AppCenter-Secret: $APPCENTER_SECRET" \
            "https://$APPCENTER_DOMAIN/projects/$PROJECT_ID/release?id=$RELEASE_ID"
