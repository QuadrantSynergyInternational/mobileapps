name: Repack Common Setup
description: >
  Shared setup steps for Android and iOS repack jobs:
  clone source repo, read app version, send log, install Node/yarn.

inputs:
  params:
    description: Build params JSON string
    required: true
  platform:
    description: Actual platform for this job — android or ios (not 'both')
    required: true
  run_id:
    description: github.run_id passed from the caller
    required: true
  appcenter_secret:
    description: X-AppCenter-Secret header value
    required: true
  appcenter_domain:
    description: AppCenter host (e.g. appcenterq.vercel.app)
    required: true
  git_username:
    description: Git username for self-hosted clone
    required: true
  git_password:
    description: Git password / token for self-hosted clone
    required: true

outputs:
  current-version:
    description: App version read from package.json
    value: ${{ steps.package-version.outputs.current-version }}

runs:
  using: composite
  steps:
    - name: Mask sensitive parameters
      shell: bash
      run: node scripts/mask-params.js

    - name: Clone Source Repo
      shell: bash
      env:
        GIT_USERNAME: ${{ inputs.git_username }}
        GIT_PASSWORD: ${{ inputs.git_password }}
      run: node scripts/clone-repo.js

    - name: Get App Version
      id: package-version
      shell: bash
      working-directory: input
      run: |
        current_version=$(node -e "console.log(require('./package.json').version)")
        echo "current-version=$current_version" >> "$GITHUB_OUTPUT"

    - name: Logging
      shell: bash
      env:
        APPCENTER_SECRET: ${{ inputs.appcenter_secret }}
        APPCENTER_DOMAIN: ${{ inputs.appcenter_domain }}
      run: node scripts/trigger-log.js --platform "${{ inputs.platform }}" --version "${{ steps.package-version.outputs.current-version }}"

    - name: Setup Node.js
      if: ${{ fromJSON(inputs.params).node != '' }}
      uses: actions/setup-node@v4.0.4
      with:
        node-version: ${{ fromJSON(inputs.params).node }}

    - name: Cache Node Modules
      uses: actions/cache@v4
      with:
        path: input/node_modules
        key: ${{ runner.os }}-node-modules-${{ fromJSON(inputs.params).projectid }}-${{ hashFiles('input/yarn.lock', 'input/package-lock.json', 'input/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-node-modules-${{ fromJSON(inputs.params).projectid }}-

    - name: Install Dependencies
      shell: bash
      working-directory: input
      run: |
        corepack enable
        if [ -f "yarn.lock" ]; then
          yarn install
        elif [ -f "pnpm-lock.yaml" ]; then
          pnpm install
        else
          npm install
        fi
