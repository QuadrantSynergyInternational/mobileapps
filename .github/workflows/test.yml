name: Upload Dummy Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.validate.outputs.runner }}
    steps:
      - name: Validate build machine
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput("runner", "ubuntu-latest");

  release:
    needs: preflight
    runs-on: ${{ needs.preflight.outputs.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.4
        with:
          node-version: '20'

      - name: Create dummy file
        run: echo "This is a dummy test file." > dummy.txt

      - name: Upload dummy file to Release
        uses: muhamad-rizki/action-gh-release@v3.0.3
        with:
          files: dummy.txt
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-dummy' }}
          body: "Dummy file release test."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

