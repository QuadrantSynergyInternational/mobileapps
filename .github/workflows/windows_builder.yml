name: Build Windows Artifact

on:
  workflow_dispatch:
    inputs:
      params:
        type: string
        description: "Build Params JSON. Required: repo, branch, scriptpath, scriptShell, artifactPaths."
        required: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.validate.outputs.runner }}
    steps:
      - name: Validate build machine
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            let params;
            try {
              params = JSON.parse(context.payload.inputs.params);
            } catch {
              core.setFailed("params must be valid JSON");
              return;
            }
            const allowed = ["windows-2022", "windows-2025"];
            // Compatibility fallback for AppCenter versions before buildMachine dispatch.
            const runner = params.buildMachine || "windows-2025";
            if (typeof runner !== "string" || !allowed.includes(runner)) {
              core.setFailed(`Unsupported buildMachine: ${runner}`);
              return;
            }
            core.setOutput("runner", runner);

  build:
    needs: preflight
    runs-on: ${{ needs.preflight.outputs.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout CI Scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Mask sensitive parameters
        run: node scripts/mask-params.js

      - name: Clone Repo
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
        run: node scripts/clone-repo.js

      - name: Get App Version
        id: package-version
        shell: pwsh
        working-directory: input
        run: |
          if (Test-Path package.json) {
            $version = node -p "require('./package.json').version"
          } else {
            $version = Get-Date -Format 'yyyy.M.d.HHmmss'
          }
          "current-version=$version" >> $env:GITHUB_OUTPUT
          $commitHash = git rev-parse HEAD 2>$null
          "commit-hash=$commitHash" >> $env:GITHUB_OUTPUT

      - name: Logging
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
        run: node scripts/trigger-log.js --platform windows --version "${{ steps.package-version.outputs.current-version }}" --commit "${{ steps.package-version.outputs.commit-hash }}"

      - name: Setup Node.js environment
        if: ${{ fromJSON(github.event.inputs.params).node != '' && fromJSON(github.event.inputs.params).node != null }}
        uses: actions/setup-node@v4.0.4
        with:
          node-version: ${{ fromJSON(github.event.inputs.params).node }}

      - name: Execute PowerShell build script
        if: ${{ fromJSON(github.event.inputs.params).scriptShell == 'powershell' }}
        shell: pwsh
        working-directory: input
        env:
          BUILD_SCRIPT: ${{ fromJSON(github.event.inputs.params).scriptpath }}
        run: |
          $script = (Resolve-Path -LiteralPath $env:BUILD_SCRIPT).Path
          $workspace = (Resolve-Path .).Path
          if (-not $script.StartsWith("$workspace$([IO.Path]::DirectorySeparatorChar)")) { throw "Build script escapes repository" }
          & $script

      - name: Execute cmd build script
        if: ${{ fromJSON(github.event.inputs.params).scriptShell == 'cmd' }}
        shell: pwsh
        working-directory: input
        env:
          BUILD_SCRIPT: ${{ fromJSON(github.event.inputs.params).scriptpath }}
        run: |
          $script = (Resolve-Path -LiteralPath $env:BUILD_SCRIPT).Path
          $workspace = (Resolve-Path .).Path
          if (-not $script.StartsWith("$workspace$([IO.Path]::DirectorySeparatorChar)")) { throw "Build script escapes repository" }
          & cmd.exe /d /s /c "call `"$script`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve artifact paths
        id: artifact-paths
        shell: pwsh
        working-directory: input
        env:
          ARTIFACT_PATHS: ${{ toJSON(fromJSON(github.event.inputs.params).artifactPaths) }}
        run: |
          $workspace = (Resolve-Path .).Path
          $paths = $env:ARTIFACT_PATHS | ConvertFrom-Json
          $resolved = foreach ($path in $paths) {
            $matches = Get-ChildItem -Path $path -Force -ErrorAction SilentlyContinue
            if (-not $matches) { throw "Artifact path not found: $path" }
            foreach ($match in $matches) {
              $target = $match.FullName
              if (-not $target.StartsWith("$workspace$([IO.Path]::DirectorySeparatorChar)")) { throw "Artifact path escapes repository" }
              $target
            }
          }
          "paths<<EOF" >> $env:GITHUB_OUTPUT
          $resolved >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Publish release artifacts
        id: release
        uses: muhamad-rizki/action-gh-release@v3.0.5
        with:
          repository: ${{ fromJSON(github.event.inputs.params).releaseTo }}
          token: ${{ secrets.GH_PAT }}
          files: ${{ steps.artifact-paths.outputs.paths }}
          tag_name: v${{ steps.package-version.outputs.current-version }}-${{ fromJSON(github.event.inputs.params).configuration || 'Release' }}-${{ fromJSON(github.event.inputs.params).branch }}
          body: Windows artifact build v${{ steps.package-version.outputs.current-version }}

      - name: Update release
        env:
          APPCENTER_SECRET: ${{ secrets.APPCENTER_SECRET }}
          APPCENTER_DOMAIN: ${{ secrets.APPCENTER_DOMAIN }}
        run: node scripts/update-release.js --release-id "${{ steps.release.outputs.id }}" --commit "${{ steps.package-version.outputs.commit-hash }}"
